# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# the NO_MISTAKES_GATE lifecycle refusal (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI invokes instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns the context-sensitive ShellCheck modes and GitHub
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# Invocation wiring is asserted by `tests/fm-lint.test.sh` and
# `tests/fm-lint-workflows.test.sh`.
#
# Keep commands.test absent; the firstmate-coding-guidelines skill owns this policy.
commands:
  lint: 'bin/fm-lint.sh'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  instructions: |
    Run live Herdr scenarios only through bin/fm-herdr-lab.sh with a named non-default fm-lab-* session, following that helper's prepare, provision, run, and teardown contract exactly.
    Never touch the live default Herdr session or fleet panes.
    Prefer a throwaway lab for spawn, long-launch, and Claude-path proofs, and tear it down in the same evidence turn.
    The throwaway lab is structural, not honor-system: `LAB=$(bin/fm-lab-home.sh create <label>)` mints a marked lab dir under the temp root, `bin/fm-lab-home.sh adopt <dir>` marks an existing temp dir, `verify` proves a path lives in a lab, and `teardown` removes it. bin/fm-gate-refuse-lib.sh authorizes a fleet lifecycle call only when FM_HOME is (or lives inside) such a marked lab dir, so a forged marker on a real home still refuses.
    To run a real primary inside the gate: point FM_HOME at the lab dir (or a nested home inside it), write the scenario's opt-in flag (e.g. `touch $LAB/config/supervision-host`), and launch the harness's own CLI in the lab's isolated backend - `TMUX_TMPDIR=$LAB/tmux tmux -L fm-lab new-session -d` for a private tmux socket, or a named non-default fm-lab-* Herdr session via bin/fm-herdr-lab.sh. Per-harness launch commands, each using the machine's existing login for that harness: claude -> `claude`, codex -> `codex`, cursor -> `cursor-agent`, opencode -> `opencode`, grok -> `grok`, omp -> `omp`. A lab-launched primary needs the gate marker scrubbed (env -u NO_MISTAKES_GATE) - it is a fixture firstmate, not a gate agent. If the harness CLI is absent or its login is unavailable, report the scenario untested; never fake the CLI, the login, or the evidence.
    Do not mutate the operator primary checkout, real fleet FM_HOME state, or production credentials, and keep git changes otherwise inside the run worktree.
    Read docs/herdr-backend.md and the bin/fm-herdr-lab.sh header as the owners of Herdr lab mechanics rather than reproducing that manual here.
    Ship or scout briefs that will drive Herdr lifecycle still require --herdr-lab at scaffold time; these Test-agent instructions are not a substitute for that brief flag.
  evidence:
    store_in_repo: true
